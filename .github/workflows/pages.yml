name: Deploy SWE Revision Labs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          for file in app.js state-model.js patterns.js architecture.js interview-curriculum.js visual-models.js visual-contract.mjs content-contract.mjs state-contract.mjs app-contract.mjs quiz.js; do
            node --check "$file"
          done
      - name: Validate visualization interaction contracts
        run: node visual-contract.mjs
      - name: Validate curriculum and source contracts
        run: node content-contract.mjs
      - name: Validate persisted state contracts
        run: node state-contract.mjs
      - name: Validate application integration contracts
        run: node app-contract.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
